# HA package — symlink this file to /config/packages/charger.yaml
# and add to configuration.yaml (one-time):
#
#   homeassistant:
#     packages: !include_dir_named packages
#
# Then restart Home Assistant.

input_number:
  charge_target:
    name: Charge target (%)
    min: 20
    max: 100
    step: 5
    initial: 80
    unit_of_measurement: "%"
    icon: mdi:battery-charging-80
  charge_minimum:
    name: Charge immediately to (%)
    min: 0
    max: 100
    step: 5
    initial: 0
    unit_of_measurement: "%"
    icon: mdi:battery-charging-low
  soc_override:
    name: Current SoC (%)
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
    icon: mdi:battery

# Riemann-sum integral of the charger power sensor -> cumulative energy (kWh).
# Replaces the app's hand-rolled accumulation. max_sub_interval keeps the
# integral advancing during steady charging, even when the power sensor does
# not push a new state. The source entity id contains the (secret) serial, so
# it is referenced via secrets.yaml — add: charger_power_sensor: sensor.ratio_<serial>_charging_power
sensor:
  - platform: integration
    name: Charger energy total
    unique_id: charger_energy_total
    source: !secret charger_power_sensor
    unit_prefix: k
    unit_time: h
    method: trapezoidal
    max_sub_interval:
      minutes: 1
    round: 3

# Resettable session counter on top of the integral. The app resets it (via
# utility_meter.reset) on cable connect/disconnect and on every successful SoC
# sync, so the fallback can read "energy charged since SoC was last known".
utility_meter:
  charger_session_energy:
    name: Charger session energy
    source: sensor.charger_energy_total
    # No cycle: the meter never auto-resets — the app resets it explicitly
    # via utility_meter.reset (on soc_override change and cable disconnect).

input_datetime:
  charge_by:
    name: Ready by
    has_date: true
    has_time: true

input_button:
  replan:
    name: Replan
    icon: mdi:refresh
